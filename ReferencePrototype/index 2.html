const lessonPages=[
[
['Familiar is not the same as remembered',`<p>You reread your programming notes and every word looks familiar. In a closed-book quiz, you cannot define a queue. Recognising a definition on a page is different from producing it from memory.</p><p>Rereading can help you understand material initially, but it does not show whether you can retrieve it independently. A small retrieval attempt makes the gaps visible.</p><div class="mq-callout">Think of a CS term you saw this week. Could you explain it with your notes closed?</div>`],
['Give your memory a chance to answer',`<p><strong>Active recall</strong> means bringing information to mind without looking at the answer. Retrieval is the practice, and checking is how you correct it.</p><ol><li><strong>Study:</strong> understand one concept.</li><li><strong>Hide:</strong> close the source.</li><li><strong>Retrieve:</strong> answer a clear question.</li><li><strong>Check:</strong> compare with your notes and fix gaps.</li><li><strong>Review later:</strong> retrieve again after a delay.</li></ol><p>Use it for definitions, flashcards, tracing code, or explaining why an algorithm works. A flashcard only becomes recall practice when you try before flipping.</p>`],
['Watch a retrieval attempt',`<p>Study this definition: <strong>A stack removes the last item added first (LIFO).</strong> Imagine adding A, then B, then C.</p><div class="mq-demo-flow"><span>Add A</span><span>Add B</span><span>Add C</span></div><p>Now hide the definition. Which item would be removed first, and why?</p><div id="mq-demo"></div><p>Check the ordering rule, not just the familiar word. If you confused stack and queue, compare LIFO and FIFO, then try again later.</p>`],
['Try it with your notes closed',`<p>A collection removes the most recently added item first. Type the name of this data structure.</p><p>Try to retrieve the term before using the hint. Checking a mistake is part of learning.</p>`],
['Bring it into your next study session',`<p>Turn a lecture heading into a question: “What does a function do?” Close your notes, explain it, then compare.</p><ul><li>Keep one idea per flashcard.</li><li>Say or type an answer before revealing it.</li><li>Record what was missing, then retrieve again later.</li><li>Mix easy and difficult questions instead of rereading only familiar pages.</li></ul><div class="mq-callout"><strong>Study → Hide → Retrieve → Check → Review Later.</strong></div><p>Your two challenges are <strong>Word Flash</strong> and <strong>Flip & Recall</strong>. Each completed challenge constructs one purple building.</p>`]
],
[
['A long list can hide a simple pattern',`<p>Stack, Boolean, If, Queue, String, For, Array, While, Integer. Nine separate terms can feel like nine unrelated things to hold in mind.</p><p>But they share meaningful properties. Finding those properties gives you a small number of group labels to use as retrieval cues.</p><div class="mq-callout">Which of these terms describe collections? Which describe decisions or repetition?</div>`],
['Group by meaning',`<p><strong>Chunking</strong> organises separate pieces into meaningful groups. A familiar group can be treated as one organised unit rather than many unrelated items.</p><ol><li>Look for a shared function, category, or pattern.</li><li>Group items that genuinely belong together.</li><li>Give each group a useful name.</li><li>Hide the list and reconstruct each group.</li></ol><p>Use categories for revision, logical stages for procedures, and patterns for code. Chunking supports organisation; you still need to understand and retrieve the items.</p>`],
['From scattered terms to three chunks',`<p class="mq-muted">Before: Stack · Boolean · If · Queue · String · For · Array · While · Integer.</p><div class="mq-callout"><strong>Data Structures</strong><br>Stack · Queue · Array</div><div class="mq-callout"><strong>Control Flow</strong><br>If · For · While</div><div class="mq-callout"><strong>Data Types</strong><br>Integer · Boolean · String</div><p>“Data Structures” cues a group; the ordering rule still distinguishes stack from queue. Grouping by first letter alone would not explain their roles.</p><div id="mq-demo"></div>`],
['Choose a meaningful chunk',`<p>Which group consists entirely of data structures? Select a group, then check your reasoning.</p>`],
['Organise, then retrieve',`<p>For your next lecture, put concepts into categories such as “stores data”, “controls execution”, and “describes a value”. Then close the page and recreate the groups.</p><ul><li>Use a label that explains the relationship.</li><li>Keep groups small enough to understand.</li><li>Split groups that mix unrelated roles.</li><li>Check the individual details after retrieving a group.</li></ul><div class="mq-callout">A neat-looking group can still be misleading. Check that each item belongs for the reason you chose.</div><p>Practise with <strong>Sort & Remember</strong> and <strong>Code Breaker</strong> to build your blue district.</p>`]
],
[
['New words need somewhere to connect',`<p>“Stack” and “Queue” may look like two arbitrary labels. Yet you already know how plates are stacked and how people wait in a line.</p><p>A familiar experience can become a cue for a new technical idea. Explaining the connection helps you remember why it fits.</p>`],
['Build a link and explain it',`<p><strong>Association</strong> links a new idea with something familiar. <strong>Elaboration</strong> adds meaning by explaining how and why the connection works.</p><ol><li>Choose a familiar image, example, or story.</li><li>Connect a specific feature to the new concept.</li><li>Explain the connection in your own words.</li><li>Check the technical definition and the analogy’s limits.</li></ol><p>A strange story may be memorable, but it must still cue the right concepts. “They are both things” is a weak link because it explains little.</p>`],
['A queue is like a waiting line',`<div class="mq-callout"><strong>Queue → people waiting in line</strong><p>The person who arrives first is served first. A queue removes the earliest item added first: FIFO.</p></div><p>A stack of plates instead cues LIFO. A labelled container cues a variable, and repeated laps cue a loop.</p><p><strong>Where the analogy stops:</strong> people may jump a real-world line; a standard queue follows its defined operations. Variables obey language rules, and loops need a condition or count.</p><div id="mq-demo"></div>`],
['Choose and explain a link',`<p>Which analogy accurately captures a stack’s removal order? Think about the feature being shared.</p>`],
['Make connections that carry meaning',`<ul><li>Choose a familiar example with a precise shared feature.</li><li>Say why the connection works.</li><li>State what the analogy does not capture.</li><li>Hide the analogy and retrieve the technical concept.</li></ul><div class="mq-callout">Example story: “A labelled variable stores a ticket number. A function checks it, a loop repeats the checks, and a queue serves people in arrival order.”</div><p>Try <strong>Story Builder</strong> and <strong>Link the Concepts</strong>. Your completed challenges add orange creative buildings.</p>`]
],

['Forgetting gives you useful information',`<p>You could define a function yesterday, but today the definition is hazy. This is normal: a successful answer immediately after study is different from recall after a delay.</p><p>Instead of cramming every review into one sitting, return to questions across time. A difficult retrieval tells you what needs attention.</p>`],
['Space your retrieval attempts',`<p><strong>Spaced repetition</strong> combines retrieval with review sessions separated in time. It gives you opportunities to retrieve after some forgetting.</p><ol><li>Learn and retrieve a concept today.</li><li>Schedule a later review.</li><li>Check your answer before rating it.</li><li>Review missed concepts sooner.</li><li>Gradually extend intervals after successful recall.</li></ol><p>Keep sessions short. Prioritise what is due and what you missed, rather than only what feels easy.</p>`],
['One possible review schedule',`<p><strong>Day 1 → Day 2 → Day 4 → Day 7</strong></p><div class="mq-date-grid">${Array.from({length:14},(_,i)=>`<span class="${[1,2,4,7].includes(i+1)?'mq-review-day':''}">${i+1}</span>`).join('')}</div><p>Retrieve on each highlighted day. If you miss “Queue” on Day 2, check FIFO and review it sooner. If you recall “Function” reliably, leave a longer gap.</p><div class="mq-callout">These are illustrative intervals, not universal rules. Adjust them to difficulty, your timetable, and when you need the knowledge.</div><div id="mq-demo"></div>`],
['Plan the next retrieval',`<p>In the example Day 1 → Day 2 → Day 4 → Day 7, you successfully retrieved “Function” on Day 2. Which day is next in this sample schedule?</p>`],
['A realistic review habit',`<ul><li>Use questions you can answer without notes.</li><li>Schedule review in advance.</li><li>Bring missed concepts back sooner.</li><li>Track dates as well as scores.</li><li>Do not treat immediate replay as delayed retention.</li></ul><p><strong>Memory Comeback</strong> uses your earlier mistakes, with labelled example history available for testing. <strong>Rescue Forgotten Words</strong> gives missed items another chance.</p><div class="mq-callout">Your city stays built if you miss a day. Come back when you can and continue.</div>`]
],
[
['Can you explain it without the slide?',`<p>You recognise “Function” on a slide, but explaining it to a classmate reveals a gap: why would you use one?</p><p>Explaining makes missing details visible. Applying the idea to a new situation checks whether you can use it beyond the original example.</p>`],
['Explain, check, and transfer',`<ol><li>Close your notes and explain the idea simply.</li><li>Include the defining details, not just an analogy.</li><li>Notice where you hesitate or become vague.</li><li>Check a reliable source and correct gaps.</li><li>Apply the idea to an unfamiliar situation.</li></ol><p>Simple language should stay technically accurate. “A function does stuff” is short but misses that it is a reusable block for a specific task.</p>`],
['From explanation to a decision',`<div class="mq-callout"><strong>Explain:</strong> A stack removes the most recently added item first (LIFO). A queue removes the earliest added item first (FIFO).</div><p><strong>Apply:</strong> A text editor must undo the latest action first. Choose a stack because the required removal order is LIFO.</p><p>A printer serving jobs in arrival order needs a queue. The choice follows the ordering requirement, rather than which word feels familiar.</p><div id="mq-demo"></div>`],
['Keep the key detail',`<p>Which explanation is useful and technically accurate?</p>`],
['Turn recall into usable understanding',`<ul><li>Explain without looking first.</li><li>Include what distinguishes the concept.</li><li>Check missing details and correct errors.</li><li>Solve a new scenario and explain the choice.</li><li>Retrieve the refined explanation later.</li></ul><p><strong>Teach the Robot</strong> provides transparent checklist feedback. <strong>Knowledge Detective</strong> asks you to choose concepts for practical situations.</p><div class="mq-callout">Scores show performance on these activities. They do not establish improvement in general memory ability.</div>`]
]

function progressView(){let count=completed().length,all=state.attempts,graded=all.filter(a=>!a.self),recs=graded.flatMap(a=>a.records),lastPerConcept=new Map;recs.forEach(r=>lastPerConcept.set(r.term,r));let wrong=[...lastPerConcept.values()].filter(r=>!r.correct);let recovered=[...lastPerConcept.values()].filter(r=>r.correct&&recs.some(x=>x.term===r.term&&!x.correct));let delayed=recs.filter(r=>r.delayed),accuracy=recs.length?Math.round(recs.filter(r=>r.correct).length/recs.length*100):null;let repeat=C.filter(c=>attempts(c.id).length>1);return `<h1>Your progress</h1><p class="mq-small mq-muted">Every activity leaves something you can see.</p><div class="mq-panel"><div class="mq-row"><strong>Your learning journey</strong><strong>${percent()}%</strong></div>${progress(state.lessons.filter(Boolean).length+count,15)}<p class="mq-small mq-muted" style="margin-bottom:0">Completion of 5 lessons and 10 challenges.</p></div><div class="mq-metric-grid"><div class="mq-metric"><b>${state.lessons.filter(Boolean).length}/5</b><span>Lessons explored</span></div><div class="mq-metric"><b>${count}/10</b><span>Buildings constructed</span></div><div class="mq-metric"><b>${accuracy===null?'—':accuracy+'%'}</b><span>Scored-check accuracy</span></div><div class="mq-metric"><b>${delayed.length?Math.round(delayed.filter(r=>r.correct).length/delayed.length*100)+'%':'—'}</b><span>Delayed review recall</span></div></div><p class="mq-small mq-muted">Activity completion, performance, and delayed recall are different measures. Self-rated flashcards are excluded from scored accuracy. Delayed reviews may include labelled sample history.</p><h3>Improvement over attempts</h3>${repeat.length?repeat.map(c=>{let a=attempts(c.id);return `<div class="mq-panel"><strong class="mq-small">${c.title}${c.id===1?' · self-rated':''}</strong>${[a[0],a.at(-1)].map((x,i)=>`<div class="mq-bar-row"><span>${i?'Latest':'First'} attempt</span><div class="mq-progress"><div style="width:${x.score}%"></div></div><strong>${x.score}%</strong></div>`).join('')}<small class="mq-muted">${a.at(-1).score-a[0].score>=0?'+':''}${a.at(-1).score-a[0].score} percentage points · ${date(a.at(-1).date)}</small></div>`}).join(''):'<div class="mq-panel mq-small mq-muted">Replay a challenge to compare your first and latest results. No improvement is assumed before you practise.</div>'}<h3>Ideas you can now recall</h3>${recovered.length?`<div class="mq-panel">${recovered.map(r=>`<span class="mq-badge mq-success">✓ ${esc(r.term)}</span>`).join(' ')}<p class="mq-small mq-muted">Missed earlier, correct in your latest recorded check.</p></div>`:'<p class="mq-small mq-muted">Previously missed ideas appear here when you retrieve them correctly.</p>'}<h3>Practise next</h3>${wrong.length?`<div class="mq-panel">${wrong.slice(0,8).map(r=>`<p class="mq-small"><strong>${esc(r.term)}</strong><br><span class="mq-muted">${esc(r.expected)}</span></p>`).join('')}</div>`:'<p class="mq-small mq-muted">No outstanding missed ideas yet. Return to completed questions after a delay.</p>'}${state.reviews.length?`<h3>Scheduled reviews</h3><div class="mq-panel">${state.reviews.map(r=>`<div class="mq-result-line"><span>${r.term}</span><span>${date(r.due)}</span></div>`).join('')}<p class="mq-small mq-muted">${state.lessons[3]?'Start Memory Comeback when you return.':'Complete Spaced Repetition to open Memory Comeback.'}</p>${btn('Review concepts','challenge','data-id="6"','mq-secondary')}</div>`:''}<h3>Learning milestones</h3><div class="mq-achievement">${icon('flag')} ${count?'First building constructed':'Your first building is ahead'}</div>${state.lessons.every(Boolean)?`<div class="mq-achievement">${icon('award')} All five strategies explored</div>`:''}${count===10?`<div class="mq-achievement">${icon('trophy')} Your complete learning city</div>`:''}<h3>Previous challenge results</h3>${C.filter(c=>latest(c.id)).map(c=>`<button class="mq-card-button cursor-interaction" data-action="history" data-id="${c.id}"><div class="mq-copy"><strong style="font-size:15px">${c.title}</strong><small class="mq-muted">${attempts(c.id).length} attempts · latest ${latest(c.id).score}%</small></div>${chevron()}</button>`).join('')||'<p class="mq-small mq-muted">Your results appear after your first challenge.</p>'}${btn('Prototype settings','settings','','mq-secondary')}<p class="mq-bottom-note">These activities show learning performance, not a measure of general memory ability.</p>`}
function navigate(v){view=v;lastTab=v;if(v!=='city')showDemo=false;render()}
function goBack(){if(view==='welcome')return;if(view==='lessonIntro')return navigate('lessons');if(view==='lesson'){state.steps[li]=step;save();view='lessonIntro';return render()}if(view==='challenge'){view=origin==='building'?'building':'challenges';return render()}if(view==='game'){view='challenge';return render()}if(view==='building')return navigate('city');if(view==='history')return navigate('progress');if(view==='mistakes'){view=reviewOrigin;return render()}if(view==='reset'){view='settings';return render()}return navigate('home')}
function handle(action,b){if(action==='nav')return navigate(b.dataset.view);
if(action==='back')return goBack();if(action==='settings'){view='settings';return render()}
if(action==='welcome'){state.name=root.querySelector('#mq-name').value.trim()||'Alex';state.welcomed=true;save();return navigate('home')}
if(action==='rename'){state.name=root.querySelector('#mq-rename').value.trim()||'Alex';save();return navigate('home')}
if(action==='continue'){let u=C.find(x=>state.lessons[x.l]&&!latest(x.id));if(u){ci=u.id;origin='challenges';view='challenge'}else{li=Number(b.dataset.id);view=state.lessons.every(Boolean)?'progress':'lessonIntro'}return render()}
if(action==='lesson'){li=Number(b.dataset.id);view='lessonIntro';showDemo=false;return render()}
if(action==='startLesson'){step=state.lessons[li]?0:state.steps[li];guidePassed=false;guideFeedback=null;guideChoice='';demoReveal=false;view='lesson';return render()}
if(action==='nextStep'){if(step===3&&!guidePassed)return;if(step===4){state.lessons[li]=true;state.steps[li]=0;save();view='lessonDone'}else{step++;state.steps[li]=step;demoReveal=false;save()}return render()}
if(action==='prevStep'){step=Math.max(0,step-1);demoReveal=false;state.steps[li]=step;save();return render()}
if(action==='demoReveal'){demoReveal=true;return renderDemo()}
if(action==='guideChoice'){guideChoice=b.dataset.value;return render()}
if(action==='guideHint'){root.querySelector('#mq-guide-hint').hidden=false;return}
if(action==='checkGuide'){const answers=[null,0,0,1,1],ok=li===0?norm(root.querySelector('#mq-guide').value)==='stack':guideChoice===String(answers[li]);guidePassed=ok;guideFeedback=ok?['Exactly. A stack uses last-in, first-out order.','Yes. Stack, Queue, and Array all organise collections.','Exactly. The last plate added is the first removed, just like LIFO.','Yes. Day 4 comes next in this illustrative schedule.','Yes. This includes reuse and a specific task, without losing accuracy.'][li]:'Try again. Use the hint to focus on the defining detail.';return render()}
if(action==='lessonChallenges'){view='challenges';return render()}
if(action==='challenge'){ci=Number(b.dataset.id);li=C[ci].l;origin=view==='building'?'building':'challenges';view='challenge';difficulty='Medium';return render()}
if(action==='difficulty'){difficulty=b.dataset.difficulty;return render()}
if(action==='startGame')return startGame();
if(action==='building'){ci=Number(b.dataset.id);li=C[ci].l;view='building';return render()}
if(action==='history'){ci=Number(b.dataset.id??ci);view='history';return render()}
if(action==='historyMistakes'){result=attempts(ci)[Number(b.dataset.attempt)];reviewOrigin='history';view='mistakes';return render()}
if(action==='mistakes'){reviewOrigin='result';view='mistakes';return render()}
if(action==='unlock'){view='unlock';return render()}
if(action==='viewReward'){showDemo=false;return navigate('city')}
if(action==='demo'){showDemo=true;view='city';return render()}
if(action==='exitDemo'){showDemo=false;return render()}
if(action==='reset'){view='reset';return render()}
if(action==='confirmReset'){state=defaults();showDemo=false;newBuilding=-1;save();view='welcome';return render()}
if(!game)return;
const g=game;
if(action==='beginRecall'){g.stage='play';g.index=0;g.feedback=null;return render()}
if(action==='hint'){g.hint=true;return render()}
if(action==='flip'){g.flipped=true;return render()}
if(action==='selfYes'||action==='selfNo'){if(!g.flipped)return;let t=g.deck[g.index];record(t.term,action==='selfYes'?'Recalled (self-rated)':'Needed review (self-rated)',t.def,action==='selfYes');g.index++;g.flipped=false;if(g.index===g.deck.length)return finish();return render()}
if(action==='checkGroups'){let vals=sortedTerms.map((_,i)=>root.querySelector('#mq-sort-'+i).value);if(vals.some(v=>v==='')){g.groups=Object.fromEntries(vals.map((v,i)=>[i,v]));g.feedback='Choose a category for every term, then check your groups.';return render()}g.feedback=null;let n=0;sortedTerms.forEach(([t,k],i)=>{let ok=Number(vals[i])===k;if(ok)n++;record(t,categories[Number(vals[i])],categories[k],ok,`${t} belongs to ${categories[k]}.`)});g.feedback={correct:n===9,title:`${n}/9 grouped correctly`,text:'Data Structures: Stack, Queue, Array. Control Flow: If, For, While. Data Types: Integer, Boolean, String.',detail:'<p>Use these group labels as cues. Next, the list will be hidden.</p>',nextLabel:'Hide groups & recall',action:'groupRecall'};return render()}
if(action==='groupRecall'){g.stage='groupRecall';g.index=0;g.feedback=null;g.answer='';return render()}
if(action==='checkGroupRecall'){if(g.feedback)return;let sets=[['Stack','Queue','Array'],['If','For','While'],['Integer','Boolean','String']],a=sets[g.index],answer=root.querySelector('#mq-answer').value;let present=a.filter(t=>new RegExp('\\b'+norm(t)+'\\b').test(norm(answer)));let ok=present.length>=2;record(categories[g.index],answer,a.join(', '),ok,'Name at least two members of this category.');g.answer=answer;g.feedback={correct:ok,title:ok?'You reconstructed the chunk':'Keep the category meaningful',text:`${categories[g.index]}: ${a.join(', ')}. You needed at least two.`,action:'nextGroupRecall'};return render()}
if(action==='nextGroupRecall'){g.index++;g.answer='';g.feedback=null;if(g.index===3)return finish();return render()}
if(action==='sequence'){g.order.push(Number(b.dataset.value));return render()}
if(action==='undoSequence'){g.order.pop();return render()}
if(action==='checkSequence'){if(g.order.length!==6||g.feedback)return;let n=0;g.order.forEach((k,i)=>{let ok=k===i;if(ok)n++;record('Operation '+(i+1),sequence[k],sequence[i],ok,'The chunks are preparation, processing/storage, and output.')});g.feedback={correct:n===6,title:`${n}/6 operations in position`,text:sequence.join(' → '),detail:'<p>Get ready → do the work → show the result. Meaningful chunk labels support the order.</p>',action:'finish',nextLabel:'See results'};return render()}
if(action==='hideStory'){let s=root.querySelector('#mq-story').value;g.story=s;let missing=['Variable','Function','Loop','Queue'].filter(t=>!new RegExp('\\b'+t+'\\b','i').test(s));if(s.trim().length<30||missing.length){g.feedback=`Build a short story using all four terms.${missing.length?' Still needed: '+missing.join(', ')+'.':''}`;return render()}g.stage='play';g.feedback=null;g.answer='';return render()}
if(action==='checkStory'){if(g.feedback)return;let answer=root.querySelector('#mq-answer').value,n=0;['Variable','Function','Loop','Queue'].forEach(t=>{let ok=new RegExp('\\b'+t+'\\b','i').test(answer);if(ok)n++;record(t,ok?t:'Not retrieved',t,ok,terms.find(x=>x.term===t).def)});g.answer=answer;g.feedback={correct:n===4,title:`${n}/4 concepts retrieved`,text:'The original concepts were Variable, Function, Loop, and Queue.',action:'finish',nextLabel:'See results'};return render()}
if(action==='checkLinks'){let vals=links.map((_,i)=>root.querySelector('#mq-link-'+i).value);g.matches=Object.fromEntries(vals.map((v,i)=>[i,v]));if(vals.some(x=>x==='')){g.feedback='Select an analogy for every concept.';return render()}let n=0;links.forEach(([t,a,why],i)=>{let ok=Number(vals[i])===i;if(ok)n++;record(t,links[Number(vals[i])][1],a,ok,why)});g.feedback={correct:n===4,title:`${n}/4 connections matched`,text:'Stack → plates. Queue → waiting line. Variable → labelled container. Loop → repeated laps.',detail:'<p>Explain the shared feature. Remember: analogies leave out technical details.</p>',action:'beginRecall',nextLabel:'Hide links & retrieve'};return render()}
if(action==='checkRecall'){if(g.feedback)return;let answer=root.querySelector('#mq-answer').value;if(!answer.trim())return;g.answer=answer;let t=ci===5?{term:links[g.index][0],def:links[g.index][2],aliases:[links[g.index][0]]}:g.deck[g.index],ok=correctTerm(answer,t);record(t.term,answer,t.term,ok,t.def,{delayed:ci===6&&Date.now()-new Date(t.lastSeen).getTime()>=day,sample:!!t.seeded});if(ci===7){if(ok&&!g.rescued.includes(t.term))g.rescued.push(t.term);if(!ok&&!g.retried)g.retry.push({...t})}g.feedback={correct:ok,title:ok?(ci===7?'Memory rescued!':'You retrieved it!'):'A useful gap to revisit',text:`${esc(t.term)} — ${esc(t.def)}`,detail:ci===6?`<p>Next review: ${date(Date.now()+(ok?2:1)*day)}. ${ok?'A slightly longer gap.':'Bring it back sooner.'}</p>`:'',nextLabel:'Next'};return render()}
if(action==='choose'){g.choice=Number(b.dataset.value);return render()}
if(action==='checkDetective'){if(g.choice===null||g.feedback)return;let q=detectives[g.index],ok=g.choice===q.a;record(q.term,q.opts[g.choice],q.opts[q.a],ok,q.why);g.feedback={correct:ok,title:ok?'Case solved':'Follow the defining detail',text:q.why};return render()}
if(action==='checkRobot'){if(g.feedback)return;let answer=root.querySelector('#mq-robot-answer').value;if(!answer.trim())return;g.answer=answer;let q=robots[g.index],s=answer.toLowerCase(),checks=q.rules.map(([name,test])=>({name,ok:test(s)}));checks.forEach(x=>record(x.name,answer,x.name,x.ok,q.example));let n=checks.filter(x=>x.ok).length;g.feedback={correct:n===checks.length,title:`${n}/${checks.length} key ideas detected`,text:'Compare your explanation with the checklist.',detail:`${checks.map(x=>`<p>${x.ok?'✓ Included':'↻ Not detected'}: ${x.name}</p>`).join('')}<p><strong>Example:</strong> ${q.example}</p><p>A correct explanation may use wording the checklist does not recognise. Use this feedback as a prompt to check your answer.</p>`};return render()}
if(action==='finish')return finish();
if(action==='nextQuestion'){if(!g.feedback)return;g.index++;g.feedback=null;g.answer='';g.choice=null;g.hint=false;let total=ci===5?links.length:ci===8?robots.length:ci===9?detectives.length:g.deck.length;if(g.index>=total){if(ci===7&&g.retry.length&&!g.retried){g.deck=g.retry.slice();g.index=0;g.retried=true;g.retry=[];return render()}return finish()}return render()}
}
root.addEventListener('click',e=>{let b=e.target.closest('[data-action]');if(b&&!b.disabled&&root.contains(b))handle(b.dataset.action,b)});
root.addEventListener('submit',e=>{let f=e.target.closest('[data-form]');if(f){e.preventDefault();handle(f.dataset.form,f)}});
root.addEventListener('change',e=>{if(!game)return;if(e.target.dataset.sort!==undefined){game.groups[e.target.dataset.sort]=e.target.value;if(typeof game.feedback==='string'){game.feedback=null;render()}}if(e.target.dataset.match!==undefined){game.matches[e.target.dataset.match]=e.target.value;if(typeof game.feedback==='string'){game.feedback=null;render()}}});
const mqSyncViewport=()=>{const height=window.visualViewport?.height||window.innerHeight;root.style.setProperty('--mq-viewport-height',`${Math.round(height)}px`);const focused=document.activeElement;if(focused&&screen.contains(focused)&&/INPUT|TEXTAREA|SELECT/.test(focused.tagName))requestAnimationFrame(()=>focused.scrollIntoView({block:'nearest'}));};window.addEventListener('resize',mqSyncViewport);window.visualViewport?.addEventListener('resize',mqSyncViewport);mqSyncViewport();
render();
})();
</script>
